name: Publish Abicheck Baseline

on:
  workflow_dispatch:
    inputs:
      baseline_tag:
        description: "oneDAL release tag to publish as the abicheck baseline"
        required: true
        default: "2026.0.0"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  PublishBaseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Resolve baseline tag
        id: baseline
        run: |
          tag="${{ inputs.baseline_tag }}"
          if [ -z "$tag" ]; then
            tag="${{ github.event.release.tag_name }}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      # Explicitly on `main` (not whatever ref triggered this workflow --
      # for the `release: published` trigger that would be the release's
      # tag/commit, not a branch) since the dump gets committed back here.
      - name: Checkout oneDAL main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Checkout oneDAL sources at the baseline tag
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.baseline.outputs.tag }}
          path: __baseline_src

      # This job checks out the repo twice (main + __baseline_src) and builds
      # both daal and oneapi_c in debug mode (--debug symbols, uncompressed),
      # which is enough to exhaust the ~20GB free on a stock ubuntu-24.04
      # runner once the DPC++/MKL/TBB installs land too -- confirmed via a
      # prior run failing on "No space left on device" during ar archiving.
      # Free the preinstalled toolchains this job never uses before
      # installing anything Intel-side.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" /usr/local/lib/android /opt/hostedtoolcache
          df -h /

      - name: Install DPC++
        working-directory: __baseline_src
        run: .ci/env/apt.sh dpcpp
      - name: Install MKL
        working-directory: __baseline_src
        run: .ci/env/apt.sh mkl

      # Same targets as the PR-side LinuxMakeDPCPP job in ci.yml, so the
      # baseline binaries match what every PR's LinuxAbicheckScan job
      # actually compares against: daal produces libonedal_core.so (the
      # classic DAAL API), oneapi_c produces libonedal.so (the oneapi::dal
      # API) -- see the "Make onedal debug" step in LinuxMakeDPCPP.
      #
      # setvars.sh resolves MKLROOT/TBBROOT and the compiler dir on PATH by
      # picking the numerically-highest version dir under
      # /opt/intel/oneapi/{mkl,tbb,compiler}/, with no awareness of which one
      # is actually complete. `apt.sh dpcpp` (Install DPC++, above) pulls an
      # *unpinned* intel-oneapi-runtime-libs meta-package as a transitive
      # dependency, which in turn drags in unpinned intel-oneapi-runtime-mkl,
      # intel-oneapi-runtime-compilers, and intel-oneapi-tbb -- all
      # runtime-only (no static libs, no icx/icpx binaries, no tbb/tbb.h
      # header) and often newer than the devel packages `apt.sh dpcpp`/`apt.sh
      # mkl` pin. setvars then points MKLROOT/TBBROOT/PATH at those
      # newer-but-incomplete runtime dirs instead of the pinned devel ones.
      # Re-point all three at whichever installed version dir actually has
      # the devel bits this build needs, rather than trusting setvars'
      # latest-by-version-number picks.
      - name: Build daal + oneapi_c (avx2 debug)
        working-directory: __baseline_src
        run: |
          source /opt/intel/oneapi/setvars.sh
          for d in /opt/intel/oneapi/mkl/*/; do
            if [ -f "${d}lib/libmkl_intel_ilp64.a" ]; then
              export MKLROOT="${d%/}"
            fi
          done
          for d in /opt/intel/oneapi/tbb/*/; do
            if [ -f "${d}include/tbb/tbb.h" ]; then
              export TBBROOT="${d%/}"
            fi
          done
          for d in /opt/intel/oneapi/compiler/*/; do
            if [ -x "${d}bin/icx" ]; then
              export PATH="${d%/}/bin:$PATH"
            fi
          done
          echo "Using MKLROOT=$MKLROOT"
          echo "Using TBBROOT=$TBBROOT"
          echo "Using icx=$(command -v icx), icpx=$(command -v icpx)"
          .ci/scripts/build.sh --compiler icx --optimizations avx2 --target daal --debug symbols --jobs 20
          .ci/scripts/build.sh --compiler icx --optimizations avx2 --target oneapi_c --debug symbols --jobs 20

      - name: Ensure baseline output directory exists
        run: mkdir -p .github/abicheck-baselines

      # cpp/daal/include/algorithms/moments/low_order_moments_distributed.h
      # uses Online<algorithmFPType, method> (lines 134/137/153) but only
      # #includes low_order_moments_types.h -- never
      # low_order_moments_online.h, where Online is actually declared. This
      # is a genuine oneDAL header bug, invisible in every normal build only
      # because daal.h happens to #include low_order_moments_online.h right
      # before low_order_moments_distributed.h, so Online is already in
      # scope by include-order accident; any standalone parse of this header
      # fails with "no template named 'Online'". Tracked separately for a
      # real upstream fix (do not conflate with this baseline-generation
      # workflow); patched locally here, in the checked-out __baseline_src
      # copy only, purely to unblock this one baseline dump run.
      - name: TEMP local patch -- add missing include in low_order_moments_distributed.h
        run: |
          sed -i '30a #include "algorithms/moments/low_order_moments_online.h"' \
            __baseline_src/cpp/daal/include/algorithms/moments/low_order_moments_distributed.h

      # Use icpx itself (via --ast-frontend clang) instead of the default
      # castxml/GCC frontend, so cpp/oneapi/dal's SYCL headers parse -- see
      # the matching comment in ci.yml's LinuxAbicheckScan job. #606 made
      # --gcc-path recognize icx/icpx by name, so gcc-path: icpx below needs
      # no symlink workaround.
      #
      # Same setvars.sh latest-by-version-number caveat as the build step
      # above: re-point PATH at the compiler dir that actually has icx/icpx,
      # not whatever runtime-only dir setvars picked.
      - name: Put icpx on PATH
        run: |
          source /opt/intel/oneapi/setvars.sh
          for d in /opt/intel/oneapi/compiler/*/; do
            if [ -x "${d}bin/icx" ]; then
              export PATH="${d%/}/bin:$PATH"
            fi
          done
          echo "PATH=$PATH" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

      # L4 source-fact extraction (macro/constexpr/inline-body diffing) via
      # a Clang plugin is confirmed impossible against the apt-installed
      # icpx package (no LLVMConfig/ClangConfig CMake files -- see the
      # matching comment in ci.yml's LinuxAbicheckScan job).
      #
      # Two separate dumps, not one -- see the matching comment in ci.yml's
      # LinuxAbicheckScan job for why cpp/daal/include and cpp/oneapi/dal
      # each need their own library/baseline file.
      #
      # abicheck's clang-frontend castxml-parity system-include probe
      # (abicheck.dumper_sysinc) used to treat any non-"clang"-named
      # --gcc-path as a GNU compiler candidate to probe for its system
      # include dirs, which made it probe icpx itself instead of falling
      # back to g++/gcc -- icpx's own `-E -v` system-include report is
      # incomplete for plain libc (glibc's stdlib.h missing from it, hit as
      # "fatal error: 'stdlib.h' file not found" while parsing
      # daal_string.h's <cstdlib> include chain). Fixed upstream in
      # abicheck/abicheck#615 (probe now recognizes icx/icpx/dpcpp/dpcpp-cl
      # as clang-family and skips them, falling through to the real g++/gcc
      # on PATH) -- no manual -isystem workaround needed once pinned past
      # that commit.
      # cpp/daal/include/data_management/data/arrow_numeric_table.h
      # unconditionally #includes <arrow/table.h> -- an optional integration
      # header for consumers who bring their own Apache Arrow. oneDAL's own
      # build never compiles it and apt.sh installs nothing for it, and
      # installing libarrow-dev just trades that error for a different one
      # (Arrow's own <arrow/chunk_resolver.h> needs std::span, i.e. C++20,
      # while this scan is C++17). Tracked separately as an oneDAL header bug
      # (a different independent header, low_order_moments_distributed.h,
      # also fails standalone parsing -- it uses Online<...> without
      # #including low_order_moments_online.h, only working today because
      # daal.h happens to include that header first); neither is an abicheck
      # issue. The library this dump compares against was already built
      # above and doesn't reference this header, so deleting it here only
      # affects what -H walks, not the binary side.
      - name: Exclude the optional Arrow integration header from the scan
        run: rm -f __baseline_src/cpp/daal/include/data_management/data/arrow_numeric_table.h

      - name: Dump baseline snapshot (daal)
        uses: abicheck/abicheck@d278652a0ccf73fdd221a611edc5c9845817d12d # main
        with:
          mode: dump
          new-library: __baseline_src/__release_lnx/daal/latest/lib/intel64/libonedal_core.so
          new-header: __baseline_src/cpp/daal/include
          new-version: ${{ steps.baseline.outputs.tag }}
          depth: headers
          ast-frontend: clang
          gcc-path: icpx
          gcc-options: "-std=c++17"
          output-file: ".github/abicheck-baselines/${{ steps.baseline.outputs.tag }}-daal.abicheck.json"
      # cpp/oneapi/dal's own headers #include "oneapi/dal/..." (relative to
      # cpp/, not to cpp/oneapi/dal/ itself -- e.g.
      # basic_statistics_interop.hpp includes
      # "oneapi/dal/algo/basic_statistics/common.hpp"). oneapi::dal's
      # DAAL-interop layer (table_conversion.hpp etc.) goes further and pulls
      # in classic DAAL headers under BOTH cpp/daal/include/ (public API,
      # e.g. services/env_detect.h's #include "services/base.h") AND
      # cpp/daal/'s internal src/ tree (e.g.
      # cpp/daal/src/data_management/service_numeric_table.h's #include
      # "src/services/service_defines.h", relative to cpp/daal/ itself, not
      # cpp/daal/include/) -- the real build has all three on its include
      # path, but abicheck's implicit include-root heuristic only walks up
      # through directories literally named include/inc, so -H
      # cpp/oneapi/dal alone never adds any of them. Add all three
      # explicitly via `include`.
      - name: Dump baseline snapshot (oneapi::dal)
        uses: abicheck/abicheck@d278652a0ccf73fdd221a611edc5c9845817d12d # main
        with:
          mode: dump
          new-library: __baseline_src/__release_lnx/daal/latest/lib/intel64/libonedal.so
          new-header: __baseline_src/cpp/oneapi/dal
          include: __baseline_src/cpp __baseline_src/cpp/daal/include __baseline_src/cpp/daal
          new-version: ${{ steps.baseline.outputs.tag }}
          depth: headers
          ast-frontend: clang
          gcc-path: icpx
          gcc-options: "-fsycl -std=c++17"
          output-file: ".github/abicheck-baselines/${{ steps.baseline.outputs.tag }}-oneapi-dal.abicheck.json"

      # Commit the dumps directly into the repo (rather than a GitHub
      # Release asset) so the baselines PRs compare against live in version
      # control, reviewable and diffable like any other file.
      - name: Commit baseline dumps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ".github/abicheck-baselines/${{ steps.baseline.outputs.tag }}-daal.abicheck.json" \
                  ".github/abicheck-baselines/${{ steps.baseline.outputs.tag }}-oneapi-dal.abicheck.json"
          if git diff --cached --quiet; then
            echo "No changes to the baseline dumps; nothing to commit."
            exit 0
          fi
          git commit -m "Update abicheck baselines for ${{ steps.baseline.outputs.tag }}"
          git push origin HEAD:main
